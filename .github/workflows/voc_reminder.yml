name: VOC Reminder Bot

on:
  schedule:
    # 오전 9시 KST = UTC 23:30 (전날)
    - cron: '30 23 * * 0-4'
  workflow_dispatch:  # 수동 테스트용

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install slack-sdk holidays

      - name: 리마인드 실행
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN_VOC_SEND }}
        run: python voc_reminder.py
